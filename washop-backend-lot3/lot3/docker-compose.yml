# MongoDB 7 en replica set (requis pour les transactions) avec initialisation automatique.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - mongosh
      - "mongodb://mongo:27017/?directConnection=true"
      - --quiet
      - --eval
      - >-
        try { rs.status(); print('replica set deja initialise') }
        catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); print('replica set initialise') }
